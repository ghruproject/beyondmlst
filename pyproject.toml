[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chronoclade"
version = "0.1.0"
description = "Recombination-aware temporal and contextual bacterial phylogenetics"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Nabil-Fareed Alikhan", email = "nabil.alikhan@cgps.group" },
]
keywords = ["bacterial-genomics", "phylogenetics", "temporal-signal", "clonalframeml", "treetime"]
dependencies = [
  "biopython>=1.80,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "rich>=14,<15",
  "typer>=0.19,<1",
]

[project.optional-dependencies]
scale = ["scipy>=1.14,<2"]
esm2 = [
  "torch>=2.2,<3",
  "fair-esm==2.0.0",
]

[project.urls]
Homepage = "https://github.com/ghruproject/chronoclade"
Repository = "https://github.com/ghruproject/chronoclade"

[project.scripts]
chronoclade = "chronoclade.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["chronoclade"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises installed bioinformatics command-line tools"]
